<div class="col order-md-first">
    <div class="card align-items-center"
         style="height: 240px; text-align: center;">

        <form style="width: 240px;text-align: center;">
            <div class="d-inline-block mt-3" style="text-align: center;">
                <label class="form-label mb-1 pb-0" style="font-size: 12px;">
                    Adicionar Imagem
                </label>
                <input class="form-control form-control-sm" type="file"
                       style="width: 128px;">
            </div>

            <div class="d-inline-block mt-3" style="text-align: center;">
                <label
                        class="form-label mb-1" style="font-size: 12px;">
                    Tag
                </label>
                <select class="form-select form-select-sm" style="width: 106px;">
                    {% for tag in gallery_tags %}
                        <option value="{{ tag }}">{{ tag }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mt-3" style="text-align: center;">
                <button class="btn btn-primary border rounded-pill" type="button"
                        style="font-size: 14px;background: #69A7FC;padding: 8px 16px;">
                    Adicionar
                </button>
            </div>
        </form>
    </div>
</div>

{% for image in gallery_images %}

    <div class="col">
        <div class="card">

            <img class="card-img w-100 d-block"
                 src="{{ image.image.url }}"
                 alt="{{ image.title }}"
                 style="object-fit: cover; width: 100%; height: 100%">

            <div class="card-img-overlay d-flex flex-column justify-content-end ps-2 pe-4 pt-4 pb-2">
                <div class="d-inline-block" style="width: 100px;">
                                    <span style="background: #69A7FC;color: white;padding: 5px 14px;border-radius: 18px;font-size: 12px;">
                                        {{ image.tag | title }}
                                    </span>
                </div>
            </div>

            <div class="card-img-overlay d-flex flex-column align-items-end ps-4 pe-2 pt-1 pb-4">
                <button class="btn btn-danger rounded-circle"
                        type="button"
                        style="padding: 4px 8px;">
                    <svg class="bi bi-x-lg" xmlns="http://www.w3.org/2000/svg" width="1em"
                         height="1em" fill="currentColor" viewBox="0 0 16 16"
                         style="width: 16px;height: 16px;margin-bottom: 2px;">
                        <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
{% endfor %}
