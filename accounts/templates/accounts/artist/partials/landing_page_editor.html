<div class="col ps-0">
    <div style="width: 100%;height: 100%;">
        <h2 style="color: rgb(76,84,92);font-family: 'Abhaya Libre', serif;text-align: center;font-size: 22px;padding-top: 15px;padding-bottom: 10px;border-bottom: 1px solid var(--bs-dark-border-subtle);">
            Editar página inicial</h2>
        <form>
            <div class="row row-cols-1 row-cols-sm-1 row-cols-md-2 row-cols-lg-2 row-cols-xl-2 row-cols-xxl-2 mw-100">
                <div class="col">
                    <div class="mt-3">
                        <div style="width: 300px;margin-right: auto;margin-left: auto;">
                            <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                                <label class="form-label login-register-labels">
                                    Commissions Abertas:
                                    <input type="checkbox" style="width: 16px;height: 16px;margin-left: 5px;"/>
                                </label>
                            </div>
                            <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                                <label class="form-label login-register-labels">
                                    Alterar quantidade de vagas:
                                </label>
                                <input class="form-control" type="number" name="email" min="0" max="10"/>
                            </div>
                            <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                                <label class="form-label login-register-labels">
                                    Alterar instagram:
                                </label>
                                <input class="form-control login-register-inputs" type="text" name="username">
                            </div>
                            <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                                <label class="form-label login-register-labels">
                                    Alterar twitter:
                                </label>
                                <input class="form-control login-register-inputs" type="text" name="email">
                            </div>
                            <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                                <label class="form-label login-register-labels">
                                    Alterar youtube:
                                </label>
                                <input class="form-control login-register-inputs" type="text" name="email">
                            </div>
                            <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                                <label class="form-label login-register-labels">
                                    Alterar tiktok:</label>
                                <input class="form-control login-register-inputs" type="text" name="email">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col align-content-center">
                    <div class="mw-100 mt-3">
                        <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                            <label class="form-label login-register-labels">
                                Alterar icone:
                            </label>
                            <input class="form-control form-control-sm login-register-inputs" type="file"
                                   name="username"/>
                        </div>
                        <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                            <label class="form-label login-register-labels">
                                Alterar nome:
                            </label>
                            <input class="form-control login-register-inputs" type="text" name="username">
                        </div>
                        <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                            <label class="form-label login-register-labels">
                                Alterar ocupação:
                            </label>
                            <input class="form-control login-register-inputs" type="text" name="email">
                        </div>
                        <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                            <label class="form-label login-register-labels">
                                Alterar bio:
                            </label>
                            <textarea class="form-control" style="height: 160px;"></textarea>
                        </div>
                        <div class="mb-3">
                            <button class="btn btn-primary w-100 d-block login-register-btn" type="submit">
                                Atualizar Dados
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
