<div style="width: 100%;height: 100%;">
    <h2 style="color: rgb(76,84,92);font-family: 'Abhaya Libre', serif;text-align: center;font-size: 22px;padding-top: 15px;padding-bottom: 10px;border-bottom: 1px solid var(--bs-dark-border-subtle);">
        Alterar dados da conta
    </h2>
    <div class="mt-4" style="margin-top: 60px;text-align: center;">
        <h1 class="hero-h" style="color: rgb(86, 99, 112);">
            {{ user.username }}
        </h1>

        {% if user.email != "" %}
            <span class="hero-subtitle">{{ user.email }}</span>
        {% else %}
            <span class="hero-subtitle">Esta conta não possui um email.</span>
        {% endif %}

    </div>
    <div class="mt-3">
        <div style="width: 300px;margin-right: auto;margin-left: auto;">
            <form class="text-center" method="post">
                <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                    <label class="form-label login-register-labels">Alterar nome de
                        usuário:</label><input class="form-control login-register-inputs"
                                               type="text"
                                               name="username"></div>
                <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                    <label class="form-label login-register-labels">Alterar email:</label><input
                        class="form-control login-register-inputs" type="email" name="email">
                    <div class="password-recovery-container"></div>
                </div>
                <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                    <label class="form-label login-register-labels">Alterar senha:</label><input
                        class="form-control login-register-inputs" type="password" name="password">
                    <div class="password-recovery-container"></div>
                </div>
                <div class="text-start text-sm-start text-md-start text-lg-start text-xl-start text-xxl-start mb-3">
                    <label class="form-label login-register-labels">Insira sua senha atual abaixo
                        para
                        confirmar as alterações:</label><input
                        class="form-control login-register-inputs" type="password" name="password">
                    <div class="password-recovery-container"></div>
                </div>
                <div class="mb-3">
                    <button class="btn btn-primary w-100 d-block login-register-btn" type="submit">
                        Atualizar Dados
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
