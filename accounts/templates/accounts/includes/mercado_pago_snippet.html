<div id="paymentBrick_container"
     _="on unload if window.paymentBrickController call window.paymentBrickController.unmount()"></div>

<script>
    var bricksBuilder = mp.bricks();
    var renderPaymentBrick = async (bricksBuilder) => {
        var settings = {
            initialization: {
                /*
                 "amount" é o valor total a ser pago por todos os meios de pagamento
               com exceção da Conta Mercado Pago e Parcelamento sem cartão de crédito, que tem seu valor de processamento determinado no backend através do "preferenceId"
                */
                amount: {{ amount|stringformat:".2f" }},
                preferenceId: "<PREFERENCE_ID>",
                payer: {
                    firstName: "",
                    lastName: "",
                    email: "{% if user.email %} user.email {% endif %}",
                },
            },
            customization: {
                visual: {
                    style: {
                        theme: "bootstrap",
                        customVariables: {
                            baseColor: "#6ba7f7",
                            textPrimaryColor: "#6b7075",
                            borderRadiusMedium: "28px",
                            fontSizeMedium: "10px",
                            fontSizeLarge: "12px",
                        },
                    },
                    texts: {
                        formTitle: "Escolha sua forma de pagamento:"
                    },
                },
                paymentMethods: {
                    bankTransfer: "all",
                    creditCard: "all",
                    maxInstallments: 12
                },
            },
            callbacks: {
                onReady: () => {
                    /*
                     Callback chamado quando o Brick estiver pronto.
                     Aqui você pode ocultar loadings do seu site, por exemplo.
                    */
                },
                onSubmit: ({selectedPaymentMethod, formData}) => {
                    // callback chamado ao clicar no botão de submissão dos dados
                    return new Promise((resolve, reject) => {
                        fetch("/process_payment", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify(formData),
                        })
                            .then((response) => response.json())
                            .then((response) => {
                                // receber o resultado do pagamento
                                resolve();
                            })
                            .catch((error) => {
                                // lidar com a resposta de erro ao tentar criar o pagamento
                                reject();
                            });
                    });
                },
                onError: (error) => {
                    // callback chamado para todos os casos de erro do Brick
                    console.error(error);
                },
            },
        };
        window.paymentBrickController = await bricksBuilder.create(
            "payment",
            "paymentBrick_container",
            settings
        );
    };
    renderPaymentBrick(bricksBuilder);
</script>
