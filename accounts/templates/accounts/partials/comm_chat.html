{% load i18n %}

<div class="mh-100" style="width: 100%;height: 100%;">
    <h2 style="color: rgb(76,84,92);font-family: 'Abhaya Libre', serif;text-align: center;font-size: 22px;padding-top: 15px;padding-bottom: 10px;border-bottom: 1px solid var(--bs-dark-border-subtle);">
        {% translate 'Chat do Pedido:' %} {{ commission.uuid }}
    </h2>
    <div>
        <div class="row gy-4 row-cols-1 justify-content-center">
            <div class="col"
                 style="background: #EDF5FE;border-radius: 18px;padding: 18px;color: rgb(76,84,92);text-align: center;font-size: 14px;border: 1px solid var(--bs-border-color);width: 960px;">
                <div style="text-align: right;margin-bottom: 8px;">
                    <button class="btn btn-primary" role="button"
                            hx-get="{% url "comms_in_progress" %}"
                            hx-trigger="click"
                            hx-target="#content"
                            hx-swap="innerHTML"
                            style="background: #6ba7f7;border-color: #6ba7f7;border-radius: 8px;font-size: 12px;padding: 4px 8px;">
                        <i class="typcn typcn-arrow-back-outline"
                           style="margin-right: 4px;"></i>
                        {% translate 'Voltar' %}
                    </button>
                    <div id="chat"
                         class="d-flex overflow-y-auto flex-column-reverse"
                         style="height: 660px; max-height: 57.5vh">

                        {% for message in all_messages %}
                            {% include 'accounts/partials/message.html' %}
                        {% endfor %}

                    </div>
                    <form hx-ext="ws"
                          ws-connect="/ws/comm_chat/{{ commission.uuid }}"
                          ws-send
                          _="on htmx:wsAfterSend call me.reset()"
                          enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="position-relative">
                            <textarea class="form-control-sm align-middle" name="content" maxlength="600"
                                      style="border-style: solid;border-color: #6ba7f7;border-radius: 18px;height: auto;max-height: 100px;width: 100%;resize: none;min-height: 80px;padding-right: 68px;padding-left: 24px;padding-top: 8px;padding-bottom: 8px;"
                                      placeholder="Digite sua mensagem."></textarea>
                            {{ form.image }}
                            <label class="btn btn-primary position-absolute align-bottom" type="button" for="id_image"
                                   style="background: transparent;color: #6ba7f7;height: auto;font-size: 14px;padding: 2px 8px;border-radius: 18px;right: 52px;bottom: 1px;border-width: 0px;border-color: #6ba7f7;">
                                <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 24 24"
                                     width="1em" fill="currentColor" style="font-size: 28px;">
                                    <path d="M0 0h24v24H0V0z" fill="none"></path>
                                    <path d="M2 12.5C2 9.46 4.46 7 7.5 7H18c2.21 0 4 1.79 4 4s-1.79 4-4 4H9.5C8.12 15 7 13.88 7 12.5S8.12 10 9.5 10H17v2H9.41c-.55 0-.55 1 0 1H18c1.1 0 2-.9 2-2s-.9-2-2-2H7.5C5.57 9 4 10.57 4 12.5S5.57 16 7.5 16H17v2H7.5C4.46 18 2 15.54 2 12.5z"></path>
                                </svg>
                            </label>
                            <button class="btn btn-primary position-absolute align-bottom" type="submit"
                                    style="background: transparent;color: #6ba7f7;height: auto;font-size: 16px;padding: 4px 8px;border-radius: 18px;right: 14px;bottom: 1px;border-width: 0px;border-color: #6ba7f7;">
                                <i class="fa fa-send" style="font-size: 20px;"></i>
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
