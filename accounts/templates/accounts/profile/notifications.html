<div class="mh-100" style="width: 100%;height: 100%;">
    <h2 style="color: rgb(76,84,92);font-family: 'Abhaya Libre', serif;text-align: center;font-size: 22px;padding-top: 15px;padding-bottom: 10px;border-bottom: 1px solid var(--bs-dark-border-subtle);">
        Notificações
    </h2>
    <div class="row gy-3 row-cols-1 justify-content-center" style="margin-top: 16px;">
        {% for notification in notifications %}
            <div class="col">
                <div class="mw-100"
                     style="background: #EDF5FE;border-radius: 18px;padding: 20px 20px;text-align: right;padding-top: 10px;width: 600px;margin-right: auto;margin-left: auto;">
                
                    <div style="text-align: left;height: 26px;">
                        <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 24 24" width="1em"
                             fill="currentColor"
                             style="width: 26px;height: 26px;margin-right: 10px;color: var(--bs-yellow);">
                            <path d="M0 0h24v24H0z" fill="none"></path>
                            <path d="m23 12-2.44-2.78.34-3.68-3.61-.82-1.89-3.18L12 3 8.6 1.54 6.71 4.72l-3.61.81.34 3.68L1 12l2.44 2.78-.34 3.69 3.61.82 1.89 3.18L12 21l3.4 1.46 1.89-3.18 3.61-.82-.34-3.68L23 12zm-10 5h-2v-2h2v2zm0-4h-2V7h2v6z"></path>
                        </svg>
                    </div>


                    <div style="text-align: center;">
                        <p class="d-inline-block"
                           style="text-align: center;color: #69A7FC;margin: 0;padding: 0px 30px;">
                            {{ notification.message }}
                        </p>
                    </div>
                    <span class="d-inline-block align-bottom"
                          style="font-size: 12px;color: #69A7FC;">
                    {{ notification.created_at }}
                </span>

                    {% if notification.is_read %}
                        <svg class="bi bi-check-all" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                             fill="currentColor" viewBox="0 0 16 16"
                             style="color: #69A7FC;width: 24px;height: 24px;margin-left: 20px;">
                            <path d="M8.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L2.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093L8.95 4.992zm-.92 5.14.92.92a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 1 0-1.091-1.028L9.477 9.417l-.485-.486z"></path>
                        </svg>
                    {% else %}
                        <button class="btn btn-primary" type="button"
                                style="background: #69A7FC;border-color: #69A7FC;padding: 2px 8px;margin-left: 20px;">
                            <svg xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24"
                                 height="1em" viewBox="0 0 24 24" width="1em" fill="currentColor">
                                <g>
                                    <rect fill="none" height="24" width="24" x="0"></rect>
                                    <path d="M12,19c0-3.87,3.13-7,7-7c1.08,0,2.09,0.25,3,0.68V6c0-1.1-0.9-2-2-2H4C2.9,4,2,4.9,2,6v12c0,1.1,0.9,2,2,2h8.08 C12.03,19.67,12,19.34,12,19z M4,6l8,5l8-5v2l-8,5L4,8V6z M17.34,22l-3.54-3.54l1.41-1.41l2.12,2.12l4.24-4.24L23,16.34L17.34,22z"></path>
                                </g>
                            </svg>
                        </button>
                    {% endif %}

                </div>
            </div>
        {% empty %}
            <div class="col">
                <h2 class="hero-h mx-auto" style="text-align: center; font-size: 26px">
                    Nenhuma notificação encontrada.
                </h2>
            </div>
        {% endfor %}
    </div>
</div>
