{% extends "base.html" %}

{% block title %}
    {{ user.username }}
{% endblock %}

{% block content %}
    {% include "include/navbar.html" %}

    <section class="position-relative mt-9 mt-sm-9 mt-md-9 mt-lg-9 mt-xl-9 mt-xxl-10"
             style="width: 100%;height: 100%;color: rgb(33, 37, 41);">
        <div class="mw-100 overflow-auto pe-0"
             style="width: 1000px;margin: auto;background: #ffffff;border-radius: 30px;border: 1px solid var(--bs-dark-border-subtle);height: 600px;">
            <div class="row mw-100" style="height: 100%;">


                <div class="me-0 z-1 position-absolute" style="width: auto;height: auto;">

                    <div class=" top-0 bottom-0 flex-column flex-shrink-0 me-0"
                         style="width: 4.5rem;">
                        <div>
                            <a class="btn btn-primary d-block" data-bs-toggle="collapse" aria-expanded="true"
                               role="button" aria-controls="collapse-1" href="#collapse-1"
                               style="margin-right: auto;margin-left: auto;background: #69A7FC;border-radius: 30px;border-bottom-color: #69A7FC;">
                                <svg class="bi bi-person-fill" xmlns="http://www.w3.org/2000/svg" width="1em"
                                     height="1em" fill="currentColor" viewBox="0 0 16 16"
                                     style="width: 20px;height: 20px;">
                                    <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path>
                                </svg>
                            </a>
                            <div id="collapse-1" class="collapse show">
                                <div class="shadow align-content-center"
                                     style="border-radius: 30px;height: 560px;background: var(--bs-light);">
                                    <ul class="nav nav-pills text-center flex-column align-self-center mb-auto"
                                        style="border-radius: 30px;">

                                        <li class="nav-item">
                                            <input type="radio" id="sidebar-option-1" name="sidebar-option"
                                                   class="sidebar-radio">
                                            <label class="sidebar-label nav-link py-3 border-bottom rounded-0"
                                                   for="sidebar-option-1">
                                                <svg xmlns="http://www.w3.org/2000/svg" height="1em"
                                                     viewBox="0 0 24 24" width="1em" fill="currentColor">
                                                    <path d="M0 0h24v24H0z" fill="none"></path>
                                                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"></path>
                                                </svg>
                                            </label>

                                        </li>

                                        <li class="nav-item">
                                            <input type="radio" id="sidebar-option-2" name="sidebar-option"
                                                   class="sidebar-radio">
                                            <label class="sidebar-label nav-link py-3 border-bottom rounded-0"
                                                   for="sidebar-option-2">
                                                <svg class="bi bi-brush" xmlns="http://www.w3.org/2000/svg"
                                                     width="1em"
                                                     height="1em" fill="currentColor" viewBox="0 0 16 16">
                                                    <path d="M15.825.12a.5.5 0 0 1 .132.584c-1.53 3.43-4.743 8.17-7.095 10.64a6.1 6.1 0 0 1-2.373 1.534c-.018.227-.06.538-.16.868-.201.659-.667 1.479-1.708 1.74a8.1 8.1 0 0 1-3.078.132 4 4 0 0 1-.562-.135 1.4 1.4 0 0 1-.466-.247.7.7 0 0 1-.204-.288.62.62 0 0 1 .004-.443c.095-.245.316-.38.461-.452.394-.197.625-.453.867-.826.095-.144.184-.297.287-.472l.117-.198c.151-.255.326-.54.546-.848.528-.739 1.201-.925 1.746-.896q.19.012.348.048c.062-.172.142-.38.238-.608.261-.619.658-1.419 1.187-2.069 2.176-2.67 6.18-6.206 9.117-8.104a.5.5 0 0 1 .596.04M4.705 11.912a1.2 1.2 0 0 0-.419-.1c-.246-.013-.573.05-.879.479-.197.275-.355.532-.5.777l-.105.177c-.106.181-.213.362-.32.528a3.4 3.4 0 0 1-.76.861c.69.112 1.736.111 2.657-.12.559-.139.843-.569.993-1.06a3 3 0 0 0 .126-.75zm1.44.026c.12-.04.277-.1.458-.183a5.1 5.1 0 0 0 1.535-1.1c1.9-1.996 4.412-5.57 6.052-8.631-2.59 1.927-5.566 4.66-7.302 6.792-.442.543-.795 1.243-1.042 1.826-.121.288-.214.54-.275.72v.001l.575.575zm-4.973 3.04.007-.005zm3.582-3.043.002.001h-.002z"></path>
                                                </svg>
                                            </label>

                                        </li>

                                        <li class="nav-item">
                                            <input type="radio" id="sidebar-option-3" name="sidebar-option"
                                                   class="sidebar-radio">
                                            <label class="sidebar-label nav-link py-3 border-bottom rounded-0"
                                                   for="sidebar-option-3">
                                                <svg class="bi bi-clock-history" xmlns="http://www.w3.org/2000/svg"
                                                     width="1em" height="1em" fill="currentColor"
                                                     viewBox="0 0 16 16">
                                                    <path d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022zm2.004.45a7 7 0 0 0-.985-.299l.219-.976q.576.129 1.126.342zm1.37.71a7 7 0 0 0-.439-.27l.493-.87a8 8 0 0 1 .979.654l-.615.789a7 7 0 0 0-.418-.302zm1.834 1.79a7 7 0 0 0-.653-.796l.724-.69q.406.429.747.91zm.744 1.352a7 7 0 0 0-.214-.468l.893-.45a8 8 0 0 1 .45 1.088l-.95.313a7 7 0 0 0-.179-.483m.53 2.507a7 7 0 0 0-.1-1.025l.985-.17q.1.58.116 1.17zm-.131 1.538q.05-.254.081-.51l.993.123a8 8 0 0 1-.23 1.155l-.964-.267q.069-.247.12-.501m-.952 2.379q.276-.436.486-.908l.914.405q-.24.54-.555 1.038zm-.964 1.205q.183-.183.35-.378l.758.653a8 8 0 0 1-.401.432z"></path>
                                                    <path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0z"></path>
                                                    <path d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5"></path>
                                                </svg>
                                            </label>

                                        </li>

                                        {% if user.is_superuser %}
                                            <li class="nav-item">
                                                <input type="radio" id="sidebar-option-4" name="sidebar-option"
                                                       class="sidebar-radio">
                                                <label class="sidebar-label nav-link py-3 border-bottom rounded-0"
                                                       for="sidebar-option-4"
                                                       hx-get="{% url "user_manager" %}"
                                                       hx-target="#content"
                                                       hx-trigger="click"
                                                       hx-swap="innerHTML">
                                                    <svg class="bi bi-people" xmlns="http://www.w3.org/2000/svg"
                                                         width="1em"
                                                         height="1em" fill="currentColor" viewBox="0 0 16 16">
                                                        <path d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a6 6 0 0 0-1.23-.247A7 7 0 0 0 5 9c-4 0-5 3-5 4q0 1 1 1h4.216A2.24 2.24 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.5 5.5 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4"></path>
                                                    </svg>
                                                </label>

                                            </li>

                                            <li class="nav-item">
                                                <input type="radio" id="sidebar-option-5" name="sidebar-option"
                                                       class="sidebar-radio">
                                                <label class="sidebar-label nav-link py-3 border-bottom rounded-0"
                                                       for="sidebar-option-5"
                                                       hx-get="{% url "gallery_editor" %}"
                                                       hx-target="#content"
                                                       hx-trigger="click"
                                                       hx-swap="innerHTML">
                                                    <svg class="bi bi-images" xmlns="http://www.w3.org/2000/svg"
                                                         width="1em"
                                                         height="1em" fill="currentColor" viewBox="0 0 16 16">
                                                        <path d="M4.502 9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"></path>
                                                        <path d="M14.002 13a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2V5A2 2 0 0 1 2 3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-1.998 2M14 2H4a1 1 0 0 0-1 1h9.002a2 2 0 0 1 2 2v7A1 1 0 0 0 15 11V3a1 1 0 0 0-1-1M2.002 4a1 1 0 0 0-1 1v8l2.646-2.354a.5.5 0 0 1 .63-.062l2.66 1.773 3.71-3.71a.5.5 0 0 1 .577-.094l1.777 1.947V5a1 1 0 0 0-1-1z"></path>
                                                    </svg>
                                                </label>

                                            </li>

                                            <li class="nav-item">
                                                <input type="radio" id="sidebar-option-6" name="sidebar-option"
                                                       class="sidebar-radio">
                                                <label class="sidebar-label nav-link py-3 border-bottom rounded-0"
                                                       for="sidebar-option-6"
                                                       hx-get="{% url "landing_page_editor" %}"
                                                       hx-target="#content"
                                                       hx-trigger="click"
                                                       hx-swap="innerHTML">
                                                    <svg class="bi bi-house-gear" xmlns="http://www.w3.org/2000/svg"
                                                         width="1em" height="1em" fill="currentColor"
                                                         viewBox="0 0 16 16">
                                                        <path d="M7.293 1.5a1 1 0 0 1 1.414 0L11 3.793V2.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v3.293l2.354 2.353a.5.5 0 0 1-.708.708L8 2.207l-5 5V13.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 2 13.5V8.207l-.646.647a.5.5 0 1 1-.708-.708z"></path>
                                                        <path d="M11.886 9.46c.18-.613 1.048-.613 1.229 0l.043.148a.64.64 0 0 0 .921.382l.136-.074c.561-.306 1.175.308.87.869l-.075.136a.64.64 0 0 0 .382.92l.149.045c.612.18.612 1.048 0 1.229l-.15.043a.64.64 0 0 0-.38.921l.074.136c.305.561-.309 1.175-.87.87l-.136-.075a.64.64 0 0 0-.92.382l-.045.149c-.18.612-1.048.612-1.229 0l-.043-.15a.64.64 0 0 0-.921-.38l-.136.074c-.561.305-1.175-.309-.87-.87l.075-.136a.64.64 0 0 0-.382-.92l-.148-.044c-.613-.181-.613-1.049 0-1.23l.148-.043a.64.64 0 0 0 .382-.921l-.074-.136c-.306-.561.308-1.175.869-.87l.136.075a.64.64 0 0 0 .92-.382zM14 12.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0"></path>
                                                    </svg>
                                                </label>
                                            </li>
                                        {% endif %}

                                        <li class="nav-item">
                                            <input type="radio" id="sidebar-option-7" name="sidebar-option"
                                                   class="sidebar-radio" checked>
                                            <label class="sidebar-label nav-link py-3 border-bottom rounded-0"
                                                   for="sidebar-option-7"
                                                   hx-get="{% url "change_account_data" %}"
                                                   hx-target="#content"
                                                   hx-trigger="click"
                                                   hx-swap="innerHTML">
                                                <svg class="bi bi-person-gear" xmlns="http://www.w3.org/2000/svg"
                                                     width="1em" height="1em" fill="currentColor"
                                                     viewBox="0 0 16 16">
                                                    <path d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m.256 7a4.5 4.5 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10q.39 0 .74.025c.226-.341.496-.65.804-.918Q8.844 9.002 8 9c-5 0-6 3-6 4s1 1 1 1zm3.63-4.54c.18-.613 1.048-.613 1.229 0l.043.148a.64.64 0 0 0 .921.382l.136-.074c.561-.306 1.175.308.87.869l-.075.136a.64.64 0 0 0 .382.92l.149.045c.612.18.612 1.048 0 1.229l-.15.043a.64.64 0 0 0-.38.921l.074.136c.305.561-.309 1.175-.87.87l-.136-.075a.64.64 0 0 0-.92.382l-.045.149c-.18.612-1.048.612-1.229 0l-.043-.15a.64.64 0 0 0-.921-.38l-.136.074c-.561.305-1.175-.309-.87-.87l.075-.136a.64.64 0 0 0-.382-.92l-.148-.045c-.613-.18-.613-1.048 0-1.229l.148-.043a.64.64 0 0 0 .382-.921l-.074-.136c-.306-.561.308-1.175.869-.87l.136.075a.64.64 0 0 0 .92-.382zM14 12.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0"></path>
                                                </svg>

                                            </label>

                                        </li>

                                        <li class="nav-item">
                                            <a class="nav-link py-3 border-bottom rounded-0"
                                               href="{% url "logout" %}"
                                               style="color: #69A7FC; font-size: 20px;">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                                                     viewBox="0 0 24 24" fill="none">
                                                    <path d="M8.51428 20H4.51428C3.40971 20 2.51428 19.1046 2.51428 18V6C2.51428 4.89543 3.40971 4 4.51428 4H8.51428V6H4.51428V18H8.51428V20Z"
                                                          fill="currentColor"></path>
                                                    <path d="M13.8418 17.385L15.262 15.9768L11.3428 12.0242L20.4857 12.0242C21.038 12.0242 21.4857 11.5765 21.4857 11.0242C21.4857 10.4719 21.038 10.0242 20.4857 10.0242L11.3236 10.0242L15.304 6.0774L13.8958 4.6572L7.5049 10.9941L13.8418 17.385Z"
                                                          fill="currentColor"></path>
                                                </svg>
                                            </a>
                                        </li>

                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="content"
                     class="col"
                     hx-get="{% url "change_account_data" %}"
                     hx-trigger="load"
                     hx-swap="innerHTML">
                </div>
            </div>


        </div>
    </section>
{% endblock %}
