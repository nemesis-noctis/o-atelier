services:
  backend:
    build: .
    container_name: "o-atelier"
    volumes:
      - "media:/app/media"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    command: celery -A o_atelier worker -l info
    depends_on:
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:8.8.2
    container_name: redis
    restart: unless-stopped
    volumes:
      - "redis_data:/data"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 20s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - "rabbitmq_data:/var/lib/rabbitmq"
    ports:
      - "15672:15672"
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics", "-q ping" ]
      interval: 20s
      timeout: 10s
      retries: 5

  database:
    image: postgres:18.6
    container_name: db_postgres
    shm_size: 256mb
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: database
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d database" ]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  media:
  redis_data:
