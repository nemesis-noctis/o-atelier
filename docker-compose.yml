services:
  backend:
    build: .
    container_name: "o-atelier"
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:8.8.2
    container_name: redis
    restart: unless-stopped


  database:
    image: postgres:18.6
    container_name: db_postgres
    shm_size: 256mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: database
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d database" ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
